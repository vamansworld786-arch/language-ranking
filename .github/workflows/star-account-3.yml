name: Star improved-spork reported repos - Account 3

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      source_owner:
        description: 'Source owner (owner of improved-spork)'
        required: true
        default: 'Dippp10-ally'
      source_repo:
        description: 'Source repo that uploads the artifact'
        required: true
        default: 'improved-spork'
      artifact_prefix:
        description: 'Artifact name prefix'
        required: true
        default: 'python-project-report'
      max_repos:
        description: 'Maximum repos to star this run (safety limit)'
        required: true
        default: '10'
      dry_run:
        description: 'If true, do not actually call the star API'
        required: true
        default: 'false'

concurrency:
  group: star-reported-repos-account-3
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq unzip python3 python3-pip

      - name: Validate token for artifact access
        env:
          TOKEN: ${{ secrets.STAR_TOKEN_3 }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing secret STAR_TOKEN_3"
            exit 1
          fi

          USER_JSON=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/user")
          login=$(echo "$USER_JSON" | jq -r '.login // empty')
          if [ -z "$login" ]; then
            echo "::error::STAR_TOKEN_3 authentication failed."
            echo "$USER_JSON"
            exit 1
          fi
          echo "Artifact account: $login"

      - name: Download latest matching artifact zip from source repo
        env:
          TOKEN: ${{ secrets.STAR_TOKEN_3 }}
          SOURCE_OWNER: ${{ inputs.source_owner }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          PREFIX: ${{ inputs.artifact_prefix }}
        run: |
          set -euo pipefail
          mkdir -p artifact

          python3 - "$TOKEN" "$SOURCE_OWNER" "$SOURCE_REPO" "$PREFIX" > artifact_id.txt <<'PY'
          import json
          import sys
          import urllib.request

          token, owner, repo, prefix = sys.argv[1:5]

          page = 1
          artifacts = []
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/actions/artifacts?per_page=100&page={page}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-actions-workflow",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.load(resp)

              items = payload.get("artifacts", [])
              if not items:
                  break
              artifacts.extend(items)
              if len(items) < 100:
                  break
              page += 1

          matches = [a for a in artifacts if str(a.get("name", "")).startswith(prefix)]
          if not matches:
              raise SystemExit(f"No artifact found with prefix {prefix!r} in {owner}/{repo}")

          best = max(matches, key=lambda a: (a.get("updated_at") or ""))
          print(best["id"])
          PY

          ART_ID=$(tr -d '\r\n' < artifact_id.txt)
          if [ -z "$ART_ID" ] || [ "$ART_ID" = "null" ]; then
            echo "::error::No artifact found with prefix $PREFIX in $SOURCE_OWNER/$SOURCE_REPO"
            exit 1
          fi

          curl -fsSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            "https://api.github.com/repos/$SOURCE_OWNER/$SOURCE_REPO/actions/artifacts/$ART_ID/zip"

          unzip -q artifact.zip -d artifact

      - name: Extract repos list from project-report.csv
        env:
          MAX: ${{ inputs.max_repos }}
        run: |
          set -euo pipefail
          MAX="${MAX:-10}"

          CSV=$(find artifact -type f -name 'project-report.csv' | head -n 1 || true)
          if [ -z "$CSV" ]; then
            echo "::error::project-report.csv not found in artifact"
            exit 1
          fi

          python3 - "$CSV" "$MAX" <<'PY' > repos_to_star.txt
          import csv, re, sys

          csvfile = sys.argv[1]
          max_repos = int(sys.argv[2]) if len(sys.argv) > 2 and sys.argv[2] else 10

          repos = []
          with open(csvfile, newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              if not reader.fieldnames or "repository" not in reader.fieldnames:
                  raise SystemExit("CSV missing 'repository' column")

              for row in reader:
                  repo = (row.get("repository") or "").strip()
                  if not repo:
                      continue

                  if repo.startswith(("http://", "https://")):
                      m = re.match(r'https?://github\.com/([^/]+/[^/]+)', repo)
                      if m:
                          repo = m.group(1)
                      else:
                          continue

                  if '/' not in repo:
                      continue

                  repos.append(repo)

          seen = set()
          unique = []
          for r in repos:
              if r not in seen:
                  seen.add(r)
                  unique.append(r)

          final = unique[:max_repos]
          if not final:
              raise SystemExit("No repositories found in CSV after normalization/dedup")

          print("\n".join(final))
          PY

          echo "Repos to star:"
          cat repos_to_star.txt

      - name: Upload repos list artifact
        uses: actions/upload-artifact@v4
        with:
          name: repos-to-star-3
          path: repos_to_star.txt

  star:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download repo list
        uses: actions/download-artifact@v4
        with:
          name: repos-to-star-3
          path: .

      - name: Star repos using account 3 token
        env:
          TOKEN: ${{ secrets.STAR_TOKEN_3 }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ ! -f repos_to_star.txt ]; then
            echo "::error::repos_to_star.txt missing"
            exit 1
          fi

          DRY_LOWER="${DRY,,}"

          while IFS= read -r R; do
            R=$(echo "$R" | tr -d '\r')
            [ -z "$R" ] && continue

            if ! echo "$R" | grep -qE '^[^/]+/[^/]+$'; then
              echo "SKIP: repo not in owner/repo format: $R"
              continue
            fi

            if [ "$DRY_LOWER" = "true" ]; then
              echo "DRY RUN: would star $R"
              continue
            fi

            attempt=1
            while [ "$attempt" -le 3 ]; do
              STATUS=$(curl -sS -o /tmp/star.out -w "%{http_code}" \
                -X PUT \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/user/starred/$R" || echo "000")

              if [ "$STATUS" = "204" ] || [ "$STATUS" = "304" ]; then
                echo "OK: $R"
                break
              fi

              if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
                echo "::warning::Permission/auth error for $R (HTTP $STATUS)"
                cat /tmp/star.out || true
                break
              fi

              if [ "$STATUS" = "429" ] || [ "$STATUS" = "500" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
                echo "::warning::Transient failure for $R (HTTP $STATUS), retry $attempt/3"
                cat /tmp/star.out || true
                sleep 5
                attempt=$((attempt + 1))
                continue
              fi

              echo "::warning::HTTP $STATUS for $R"
              cat /tmp/star.out || true
              break
            done
          done < repos_to_star.txt

          echo "Finished account 3 star run"
